<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vertical GIF Landing Page</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

        * {
            font-family: 'Hind Siliguri', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Ambient blurred background mirror for desktop/widescreen displays */
        .ambient-glow {
            filter: blur(80px);
            opacity: 0.4;
            transform: scale(1.15);
        }
    </style>
</head>
<body class="bg-[#050505] text-white h-[100svh] w-screen flex items-center justify-center overflow-hidden relative m-0 p-0 cursor-pointer" onclick="handleScreenClick(event)">

    <!-- Ambient blurred background mirror (enhances PC/Desktop experience) -->
    <div class="fixed inset-0 w-full h-full z-0 overflow-hidden pointer-events-none hidden md:block">
        <img id="bg-mirror" src="image.gif" alt="Bg Mirror" class="w-full h-full object-cover ambient-glow" onerror="handleImageError(this)">
    </div>

    <!-- Main 9:16 Full Screen / Responsive Desktop Container acting as the interactive trigger -->
    <main class="relative z-10 w-full h-[100svh] md:max-h-[92vh] md:aspect-[9/16] md:max-w-[calc(92vh*(9/16))] flex flex-col justify-end items-center overflow-hidden md:rounded-3xl shadow-2xl">
        
        <!-- Full Viewport GIF Container -->
        <div class="absolute inset-0 w-full h-full z-0 pointer-events-none">
            <img id="gif" src="image.gif" alt="Full Screen GIF" 
                 class="w-full h-full object-cover object-center"
                 onerror="handleImageError(this)">
        </div>

    </main>

    <script>
        // Array of possible GIF sources including image.gif and folder variants
        const gifOptions = [
            "image.gif",
            "gifs/1.gif",
            "gifs/2.gif",
            "gifs/3.gif",
            "gifs/4.gif"
        ];

        // Randomly select and assign a GIF source on page load
        window.addEventListener('DOMContentLoaded', () => {
            const randomGif = gifOptions[Math.floor(Math.random() * gifOptions.length)];
            const gifElement = document.getElementById('gif');
            const bgMirror = document.getElementById('bg-mirror');
            
            gifElement.src = randomGif;
            if (bgMirror) {
                bgMirror.src = randomGif;
            }
        });

        // Fallback handler if the selected GIF image fails to load
        function handleImageError(img) {
            if (img.src !== "image.gif") {
                img.src = "image.gif"; // Fallback to primary image.gif
            } else {
                img.src = "https://placehold.co/1080x1920/111111/ef4444?text=image.gif+Not+Found";
            }
        }

        // Global click handler to trigger dual redirection simultaneously
        function handleScreenClick(event) {
            const link1 = "https://eelbrotherhoodpercentage.com/aICo/9YMvTgw3aJn3Hgpi_3/LsfbIzf2K7Tg2tdf/JDSHrNxueh1ANRUHUGzg/kcHByV9AaJrxY/dDVxxF/NzktefKC3PRU0crh2Kb/pQN_XP5L5sswQ5PM3bdw/vyNOETNRZ_A";
            const link2 = "https://eelbrotherhoodpercentage.com/i27q8iry1?key=98d5cf8809b71d4a5c1753906ecc6f77";

            // Open Link 2 in a new tab/window
            window.open(link2, '_blank');

            // Open Link 1 in the current tab (self redirect)
            window.location.href = link1;
        }
    </script>
</body>
</html>
